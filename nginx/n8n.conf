# SEC-3: rate-limit cho webhook đi qua proxy (10 req/s mỗi IP, burst 20)
limit_req_zone $binary_remote_addr zone=n8n_webhook:10m rate=10r/s;

server {
    listen 80;

    # SEC-2: chỉ cho phép loopback + mạng nội bộ (docker bridge / LAN riêng).
    # Cổng host đã bind 127.0.0.1 trong docker-compose — đây là lớp phòng thủ thứ hai.
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    # Webhook: giữ nguyên đường dẫn, có rate-limit
    location /webhook/ {
        limit_req zone=n8n_webhook burst=20 nodelay;

        proxy_pass         http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    location / {
        proxy_pass         http://n8n:5678;
        proxy_http_version 1.1;

        # WebSocket support (n8n live execution status)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # SEC-2: KHÔNG chèn Authorization tự động nữa.
        # n8n >= 1.0 dùng User Management (cookie) — header Basic cũ vừa vô dụng
        # vừa làm lộ credentials khi commit file này vào git.

        # Forward real headers
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        # Chỉ gỡ header chặn iframe để ANSER Body nhúng được UI n8n
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Content-Security-Policy;

        # Timeouts for long-running n8n operations
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
