server {
    listen 80;

    location / {
        proxy_pass         http://n8n:5678;
        proxy_http_version 1.1;

        # WebSocket support (n8n live execution status)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Auto-login: inject basic auth credentials so n8n skips login prompt
        proxy_set_header   Authorization "Basic YWRtaW46Y2hhbmdlbWUxMjM=";

        # Forward real headers
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        # Strip headers that block iframe embedding and force re-auth
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Content-Security-Policy;
        proxy_hide_header  WWW-Authenticate;

        # Timeouts for long-running n8n operations
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
