<!-- ============ NOTIFICATION PANEL ============ -->
<div class="noti-panel" id="notiPanel">
    <div class="noti-panel__header">
        <h3>
            <i class="fa-regular fa-bell"></i>
            Thông báo <span class="noti-panel__count" id="notiCountText">0 mới</span>
        </h3>
        <button class="noti-panel__action" data-action="mark-all-read" aria-label="Đánh dấu đã đọc">
            <i class="fa-solid fa-check-double"></i>
        </button>
    </div>
    <div class="noti-panel__body" id="notiList">
        <div class="empty-state" style="padding: 40px 20px">
            <i class="fa-regular fa-bell-slash"></i>
            <p>Chưa có thông báo nào</p>
        </div>
    </div>
    <div class="noti-panel__footer">
        <a href="#" class="noti-panel__link">Xem tất cả thông báo →</a>
    </div>
</div>
