<!-- ============ HEADER ============ -->
<header class="header" id="appHeader">
    <div class="header__left">
        <button class="header__menu-toggle" id="menuToggle" aria-label="Toggle menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="header__search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="headerSearch" placeholder="Tìm kiếm sản phẩm, khách hàng, đơn hàng..." />
        </div>
    </div>
    <div class="header__right">
        <button class="header__icon-btn" id="notificationBtn" aria-label="Thông báo">
            <i class="fa-regular fa-bell"></i>
            <span class="header__badge" id="notificationCount" style="display:none">0</span>
        </button>
    </div>
</header>
