<!-- products.html — Danh sách sản phẩm -->
<div class="content__header">
  <h1 class="content__title">Danh sách sản phẩm</h1>
  <p class="content__subtitle">Quản lý toàn bộ sản phẩm trong kho hàng · Tổng: <strong id="productTotal">0</strong> sản phẩm</p>
</div>

<div class="toolbar">
  <div class="toolbar__filters">
    <div class="toolbar__search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="productSearch" placeholder="Tìm mã hoặc tên SP..." />
    </div>
    <select class="filter-select" id="filterCategory">
      <option value="">Tất cả danh mục</option>
      <option value="Điện tử">Điện tử</option>
      <option value="Thời trang">Thời trang</option>
      <option value="Gia dụng">Gia dụng</option>
      <option value="Thực phẩm">Thực phẩm</option>
    </select>
    <select class="filter-select" id="filterStatus">
      <option value="">Tất cả trạng thái</option>
      <option value="in-stock">Còn hàng</option>
      <option value="low-stock">Sắp hết</option>
      <option value="out-of-stock">Hết hàng</option>
    </select>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn--outline" onclick="Router.exportProductsCSV()">
      <i class="fa-solid fa-file-export"></i> Xuất CSV
    </button>
    <button class="btn btn--primary" id="btnAddProduct">
      <i class="fa-solid fa-plus"></i> Thêm sản phẩm
    </button>
  </div>
</div>

<div class="table-card" id="productsTableCard">
  <div class="table-card__body">
    <table class="data-table" id="productTable">
      <thead>
        <tr>
          <th style="width: 36px"><input type="checkbox" id="selectAll" /></th>
          <th class="sortable" data-sort-dir=""><span>Sản phẩm</span> <i class="fa-solid fa-sort"></i></th>
          <th class="sortable" data-sort-dir=""><span>Danh mục</span> <i class="fa-solid fa-sort"></i></th>
          <th class="sortable num" data-sort-dir=""><span>Tồn kho</span> <i class="fa-solid fa-sort"></i></th>
          <th class="sortable num" data-sort-dir=""><span>Giá bán</span> <i class="fa-solid fa-sort"></i></th>
          <th>Trạng thái</th>
          <th style="width: 90px">Hành động</th>
        </tr>
      </thead>
      <tbody id="productTableBody"></tbody>
    </table>
  </div>
  <div class="pagination">
    <span class="pagination__info" id="paginationInfo">Hiển thị 1-5</span>
    <div class="pagination__controls" id="paginationControls"></div>
  </div>
</div>

<script>
(function() {
  let currentPage = 1;
  const PAGE_SIZE = 8;
  let sortKey = null;
  let sortDir = "asc";

  function getStatus(p) {
    if (p.stock === 0) return { key: "out-of-stock", label: "Hết hàng", color: "red" };
    if (p.stock <= 10) return { key: "low-stock", label: "Sắp hết", color: "orange" };
    return { key: "in-stock", label: "Còn hàng", color: "green" };
  }

  function filteredSorted() {
    const q = document.getElementById("productSearch").value.toLowerCase();
    const cat = document.getElementById("filterCategory").value;
    const status = document.getElementById("filterStatus").value;
    let rows = Store.products.filter(p => {
      if (cat && p.category !== cat) return false;
      if (status && getStatus(p).key !== status) return false;
      if (q && !p.code.toLowerCase().includes(q) && !p.name.toLowerCase().includes(q)) return false;
      return true;
    });
    if (sortKey) {
      rows.sort((a, b) => {
        let va = a[sortKey], vb = b[sortKey];
        if (typeof va === "string") { va = va.toLowerCase(); vb = vb.toLowerCase(); }
        if (va < vb) return sortDir === "asc" ? -1 : 1;
        if (va > vb) return sortDir === "asc" ? 1 : -1;
        return 0;
      });
    }
    return rows;
  }

  function renderTable() {
    const all = filteredSorted();
    document.getElementById("productTotal").textContent = Store.products.length;
    const totalPages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageRows = all.slice(start, start + PAGE_SIZE);
    const tbody = document.getElementById("productTableBody");
    tbody.innerHTML = pageRows.map(p => {
      const s = getStatus(p);
      return `
        <tr data-id="${p.id}">
          <td><input type="checkbox" class="row-check" /></td>
          <td>${Helpers.tableAvatar(p.code, p.name, p.code)}</td>
          <td>${Helpers.escapeHtml(p.category)}</td>
          <td class="num">${Helpers.formatNumber(p.stock)}</td>
          <td class="num" title="${Helpers.formatVND(p.sellPrice)}">${Helpers.formatVNDShort(p.sellPrice)}</td>
          <td><span class="badge badge--${s.color}">${s.label}</span></td>
          <td>
            <button class="action-btn" onclick="Router.editProduct(${p.id})" title="Sửa"><i class="fa-solid fa-pen"></i></button>
            <button class="action-btn action-btn--danger" onclick="Router.deleteProduct(${p.id})" title="Xoá"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `;
    }).join("");
    document.getElementById("paginationInfo").textContent = all.length
      ? `Hiển thị ${start + 1}-${Math.min(start + PAGE_SIZE, all.length)} / ${all.length}`
      : "Không có dữ liệu";
    // pagination controls
    const ctrls = document.getElementById("paginationControls");
    let html = `<button class="page-btn" data-pg="${Math.max(1, currentPage - 1)}" ${currentPage === 1 ? "disabled" : ""}><i class="fa-solid fa-chevron-left"></i></button>`;
    for (let i = 1; i <= totalPages; i++) {
      html += `<button class="page-btn ${i === currentPage ? "active" : ""}" data-pg="${i}">${i}</button>`;
    }
    html += `<button class="page-btn" data-pg="${Math.min(totalPages, currentPage + 1)}" ${currentPage === totalPages ? "disabled" : ""}><i class="fa-solid fa-chevron-right"></i></button>`;
    ctrls.innerHTML = html;
    ctrls.querySelectorAll(".page-btn").forEach(b => {
      b.addEventListener("click", () => {
        const p = parseInt(b.dataset.pg);
        if (p && !isNaN(p)) { currentPage = p; renderTable(); }
      });
    });
  }

  // wire up filters
  document.getElementById("productSearch").addEventListener("input", () => { currentPage = 1; renderTable(); });
  document.getElementById("filterCategory").addEventListener("change", () => { currentPage = 1; renderTable(); });
  document.getElementById("filterStatus").addEventListener("change", () => { currentPage = 1; renderTable(); });
  // sort
  document.querySelectorAll("#productTable th.sortable").forEach(th => {
    th.style.cursor = "pointer";
    th.addEventListener("click", () => {
      const text = th.querySelector("span")?.textContent.trim();
      const map = { "Sản phẩm": "name", "Danh mục": "category", "Tồn kho": "stock", "Giá bán": "sellPrice" };
      const key = map[text];
      if (!key) return;
      if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortKey = key; sortDir = "asc"; }
      document.querySelectorAll("#productTable th.sortable").forEach(t => t.dataset.sortDir = "");
      th.dataset.sortDir = sortDir;
      renderTable();
    });
  });

  // select all
  document.getElementById("selectAll").addEventListener("change", (e) => {
    document.querySelectorAll(".row-check").forEach(c => { c.checked = e.target.checked; });
  });

  // Add product button
  document.getElementById("btnAddProduct").addEventListener("click", () => {
    Router.editProduct(null);
  });

  renderTable();
})();
</script>
