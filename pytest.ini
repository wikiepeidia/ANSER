[pytest]
testpaths = tests
# tests/ has no __init__.py, so pytest's default "prepend" import mode would
# otherwise insert tests/ itself (not the repo root) into sys.path, breaking
# `from core.config import Config` etc. in tests/conftest.py. Explicitly add
# the repo root so app modules (core/, routes/, app.py) are importable.
pythonpath = .
# tests/contracts, tests/integration, tests/jobs, tests/parity, tests/security,
# tests/services are untracked cross-branch leftovers (this repo's working tree
# is shared across the ANSER "mixed"/"anser-ban-le" branch and this "anser-san-xuat"
# branch; switching branches leaves the other app's untracked files on disk —
# see .planning/STATE.md decisions log, 2026-07-16). None of them belong to this
# branch's test suite, so they are excluded from collection.
norecursedirs = contracts integration jobs parity security services .git __pycache__
