services:
  n8n:
    image: n8nio/n8n:latest
    container_name: anser-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5680}:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      # N8N_SECURE_COOKIE=false required for HTTP (non-HTTPS) communication
      # Without this, n8n reports webhook URLs using its internal port (5678)
      # instead of the actual host-mapped port, which breaks manual testing.
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5680}/
    volumes:
      - n8n_data:/home/node/.n8n

  mailhog:
    image: mailhog/mailhog:latest
    container_name: anser-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"  # SMTP — n8n's Send Email node connects here
      - "${MAILHOG_WEB_PORT:-8025}:8025"   # Web UI — view "sent" emails at localhost:8025

volumes:
  n8n_data:
