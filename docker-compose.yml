services:
  n8n:
    image: n8nio/n8n:latest
    container_name: anser-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      # N8N_SECURE_COOKIE=false required for HTTP (non-HTTPS) communication
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
