<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điều khiển - {{ project_name }}</title>
    <!-- Favicons -->
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <meta name="theme-color" content="#00a688">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="dashboard">
        <div class="header">
            <h1>Chào mừng đến với bảng điều khiển của bạn</h1>
            <p>Xin chào <strong>{{ user }}</strong> ({{ role }})</p>
        </div>

        <div class="dashboard-content">
            <h2>Bạn đã đăng nhập thành công.</h2>
            <p>Đây là bảng điều khiển của {{ project_name }}.</p>

            <div class="actions">
                <a href="{{ url_for('logout') }}" class="btn-logout">Đăng xuất</a>
            </div>
        </div>
    </div>
</body>

</html>
