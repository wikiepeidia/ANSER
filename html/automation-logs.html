<!-- automation-logs.html — Lịch sử chạy tự động -->
<div class="content__header">
  <h1 class="content__title">Lịch sử chạy tự động</h1>
  <p class="content__subtitle">Theo dõi các lần chạy rule tự động, lỗi và kết quả thực thi</p>
</div>

<div class="report-toolbar">
  <div class="chart-card__actions" id="logFilterBtns">
    <button class="chart-btn active" data-filter="all">Tất cả</button>
    <button class="chart-btn" data-filter="success">Thành công</button>
    <button class="chart-btn" data-filter="failed">Thất bại</button>
    <button class="chart-btn" data-filter="skipped">Bỏ qua</button>
  </div>
  <div class="report-toolbar__right">
    <button class="btn btn--outline"><i class="fa-solid fa-file-export"></i> Xuất log</button>
    <button class="btn btn--primary" onclick="showToast('Đã làm mới log!')"><i class="fa-solid fa-rotate"></i> Làm mới</button>
  </div>
</div>

<div class="stats-grid stats-grid--4">
  <div class="stat-card"><div class="stat-card__icon stat-card__icon--green"><i class="fa-solid fa-circle-check"></i></div><div class="stat-card__info"><span class="stat-card__label">Thành công</span><span class="stat-card__value" id="successCount">0</span><span class="stat-card__change stat-card__change--up"><i class="fa-solid fa-arrow-up"></i> 24h</span></div></div>
  <div class="stat-card"><div class="stat-card__icon stat-card__icon--red"><i class="fa-solid fa-circle-xmark"></i></div><div class="stat-card__info"><span class="stat-card__label">Thất bại</span><span class="stat-card__value" id="failedCount">0</span><span class="stat-card__change stat-card__change--alert"><i class="fa-solid fa-triangle-exclamation"></i> Cần xem</span></div></div>
  <div class="stat-card"><div class="stat-card__icon stat-card__icon--orange"><i class="fa-solid fa-forward"></i></div><div class="stat-card__info"><span class="stat-card__label">Bỏ qua</span><span class="stat-card__value" id="skippedCount">0</span><span class="stat-card__change stat-card__change--down"><i class="fa-solid fa-clock"></i> Tạm dừng</span></div></div>
  <div class="stat-card"><div class="stat-card__icon stat-card__icon--blue"><i class="fa-solid fa-bolt"></i></div><div class="stat-card__info"><span class="stat-card__label">Tổng lượt</span><span class="stat-card__value" id="totalCount">0</span><span class="stat-card__change stat-card__change--up"><i class="fa-solid fa-clock"></i> 24h qua</span></div></div>
</div>

<div class="table-card">
  <div class="table-card__header"><h3>Nhật ký chạy gần đây</h3></div>
  <div class="table-card__body">
    <table class="data-table">
      <thead><tr><th style="width:32px"></th><th>Thời gian</th><th>Rule</th><th>Nội dung</th><th>Trạng thái</th></tr></thead>
      <tbody id="logsBody"></tbody>
    </table>
  </div>
</div>

<script>
(function() {
  const STATUS_META = {
    success: { icon: "fa-check", color: "green", label: "Thành công" },
    failed: { icon: "fa-xmark", color: "red", label: "Thất bại" },
    skipped: { icon: "fa-forward", color: "orange", label: "Bỏ qua" },
  };

  function render(filter) {
    const logs = filter === "all" ? Store.logs : Store.logs.filter(l => l.status === filter);
    document.getElementById("successCount").textContent = Store.logs.filter(l => l.status === "success").length;
    document.getElementById("failedCount").textContent = Store.logs.filter(l => l.status === "failed").length;
    document.getElementById("skippedCount").textContent = Store.logs.filter(l => l.status === "skipped").length;
    document.getElementById("totalCount").textContent = Store.logs.length;
    document.getElementById("logsBody").innerHTML = logs.map(l => {
      const m = STATUS_META[l.status];
      return `
        <tr>
          <td><span class="log-status log-status--${l.status}"><i class="fa-solid ${m.icon}"></i></span></td>
          <td>${l.time}</td>
          <td><strong>${Helpers.escapeHtml(l.rule)}</strong></td>
          <td>${Helpers.escapeHtml(l.msg)}</td>
          <td><span class="pill pill--${m.color}">${m.label}</span></td>
        </tr>
      `;
    }).join("");
  }

  // Initial render
  render("all");

  // Filter buttons
  document.querySelectorAll("#logFilterBtns .chart-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#logFilterBtns .chart-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render(btn.dataset.filter);
    });
  });

  // Simulate a new log every 30 seconds
  setInterval(() => {
    if (Math.random() > 0.7) {
      const statuses = ["success", "success", "success", "failed", "skipped"];
      const rules = Store.rules.map(r => r.title);
      const status = statuses[Math.floor(Math.random() * statuses.length)];
      const rule = rules[Math.floor(Math.random() * rules.length)];
      const messages = {
        success: `Rule kích hoạt thành công, xử lý xong trong ${(Math.random() * 2).toFixed(1)}s`,
        failed: `Lỗi: timeout khi gọi API (status=${Math.floor(Math.random()*500+500)})`,
        skipped: `Rule đang tạm dừng, bỏ qua lịch chạy.`,
      };
      const now = new Date();
      const time = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")} · hôm nay`;
      Store.addLog({ status, rule, msg: messages[status], meta: `${rule} · ${(Math.random()*2).toFixed(1)}s`, time });
      const activeFilter = document.querySelector("#logFilterBtns .chart-btn.active")?.dataset.filter || "all";
      render(activeFilter);
    }
  }, 30000);
})();
</script>
