name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ban naive placeholder replace
        # .replace('?', '%s') corrupts LIKE patterns and JSON operators.
        # All placeholder conversion must go through core/database.py::_to_pg().
        run: |
          if grep -rn "\.replace(['\"]?['\"], ['\"]%s['\"])" core/ routes/ --include="*.py"; then
            echo "ERROR: Found .replace('?', '%s') — use _to_pg() in PGShimCursor instead."
            exit 1
          fi
          echo "OK: no banned replace pattern found."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/services/ -v
